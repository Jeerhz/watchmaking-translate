[project]
name = "trad-gmt"
version = "0.1.0"
description = "French → English/German watchmaking machine translation for GMT Publishing"
readme = "README.md"
authors = [
    { name = "Jeerhz", email = "adlesalem@hotmail.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
    "selectolax>=1.0.1",
    "sentence-transformers>=5.7.0",
    "tqdm>=4.70.1",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
trad-gmt = "trad_gmt.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Argument/Option defaults are idiomatic
